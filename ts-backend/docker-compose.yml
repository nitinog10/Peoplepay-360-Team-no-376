# Optional local MySQL 8 for development.
#   docker compose up -d
# Then set DATABASE_URL="mysql://root:root@localhost:3306/peoplepay360" in .env
services:
  mysql:
    image: mysql:8.4
    container_name: peoplepay360-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: peoplepay360
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
